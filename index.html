<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="description" content="Kochbuch-App für Rezepte, Suche und PWA-Erlebnis" />
    <title>Kochbuch</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-512x512.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#fff7ed',
                100: '#ffedd5',
                500: '#f59e0b',
                600: '#d97706',
              },
              slatewarm: '#f8fafc',
            },
            boxShadow: {
              soft: '0 10px 25px rgba(15, 23, 42, 0.08)',
            },
          },
        },
      };
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body {
        background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      }
      .app-shell {
        background: rgba(255,255,255,0.6);
        backdrop-filter: blur(6px);
      }
      .skeleton {
        animation: pulse 1.6s ease-in-out infinite;
        background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
        background-size: 200% 100%;
      }
      @keyframes pulse {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body class="text-slate-800 antialiased">
    <div class="min-h-screen">
      <div class="app-shell mx-auto min-h-screen max-w-md shadow-soft lg:mt-4 lg:rounded-[28px] lg:border lg:border-slate-200 lg:shadow-soft">
        <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 px-4 py-3 backdrop-blur-sm">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-xs font-medium uppercase tracking-[0.2em] text-amber-600">Kochbuch</p>
              <h1 id="pageTitle" class="text-xl font-bold text-slate-900">Rezepte</h1>
            </div>
            <button id="addRecipeButton" type="button" class="rounded-full bg-amber-500 px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-amber-600">
              + Rezept
            </button>
          </div>
        </header>

        <main class="pb-24">
          <section id="homeView" class="space-y-4 px-4 py-4">
            <div id="homeHeader" class="flex items-center justify-between">
              <div>
                <h2 class="text-lg font-semibold text-slate-900">Alle Rezepte</h2>
              </div>
            </div>
            <div id="homeCards" class="space-y-4"></div>
          </section>

          <section id="searchView" class="hidden space-y-4 px-4 py-4">
            <div class="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
              <label class="mb-2 block text-sm font-medium text-slate-700" for="searchInput">Suchen</label>
              <input id="searchInput" type="search" placeholder="Titel, Zutaten, Tags..." class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-200" />
            </div>
            <div>
              <p class="mb-2 text-sm font-medium text-slate-700">Tags</p>
              <div id="tagFilters" class="flex flex-wrap gap-2"></div>
            </div>
            <div id="searchCards" class="space-y-4"></div>
          </section>

          <section id="formView" class="hidden px-4 py-4">
            <div class="mb-4 flex items-center justify-between">
              <button id="backFromForm" type="button" class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm">
                ← Zurück
              </button>
              <p id="formTitleText" class="text-sm font-medium uppercase tracking-[0.18em] text-amber-600">Neues Rezept</p>
            </div>

            <form id="recipeForm" class="space-y-4">
              <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                <label class="mb-2 block text-sm font-medium text-slate-700" for="recipeTitle">Titel</label>
                <input id="recipeTitle" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-200" />
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                  <label class="mb-2 block text-sm font-medium text-slate-700" for="prepTime">Vorbereitungszeit (min)</label>
                  <input id="prepTime" type="number" min="0" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-200" />
                </div>
                <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                  <label class="mb-2 block text-sm font-medium text-slate-700" for="totalTime">Gesamtzeit (min)</label>
                  <input id="totalTime" type="number" min="0" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-200" />
                </div>
              </div>

              <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                <label class="mb-2 block text-sm font-medium text-slate-700" for="servings">Portionen</label>
                <input id="servings" type="number" min="1" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-200" />
              </div>

              <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                <div class="mb-3 flex items-center justify-between">
                  <h3 class="text-sm font-semibold text-slate-800">Zutaten</h3>
                  <button id="addIngredientRow" type="button" class="rounded-full bg-emerald-500 px-3 py-1.5 text-xs font-semibold text-white hover:bg-emerald-600">+ hinzufügen</button>
                </div>
                <div id="ingredientRows" class="space-y-2"></div>
              </div>

              <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                <label class="mb-2 block text-sm font-medium text-slate-700" for="recipeInstructions">Zubereitung</label>
                <textarea id="recipeInstructions" rows="8" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-200"></textarea>
              </div>

              <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                <label class="mb-2 block text-sm font-medium text-slate-700" for="recipeImageUrl">Bild-URL</label>
                <input id="recipeImageUrl" type="url" placeholder="https://..." class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-200" />
                <div class="mt-3">
                  <label for="recipeImageFile" class="inline-flex cursor-pointer items-center gap-2 rounded-xl border border-dashed border-amber-300 bg-amber-50 px-3 py-2 text-sm font-medium text-amber-700">
                    <span>Bild hochladen</span>
                    <input id="recipeImageFile" type="file" accept="image/*" class="hidden" />
                  </label>
                  <span id="uploadStatus" class="ml-2 text-xs text-slate-500"></span>
                </div>
              </div>

              <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                <label class="mb-2 block text-sm font-medium text-slate-700" for="recipeTags">Tags</label>
                <input id="recipeTags" placeholder="z. B. vegetarisch, schnell, Abendessen" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-200" />
              </div>

              <div class="flex gap-3 pt-2">
                <button id="submitRecipe" type="submit" class="flex-1 rounded-2xl bg-amber-500 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-amber-600">Speichern</button>
                <button id="deleteRecipeButton" type="button" class="hidden rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-600 hover:bg-red-100">Löschen</button>
              </div>
            </form>
          </section>

          <section id="detailView" class="hidden">
            <div id="detailContent"></div>
          </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-slate-200 bg-white/90 px-4 py-3 backdrop-blur-sm">
          <div class="mx-auto flex max-w-md items-center justify-around">
            <button data-nav="home" class="nav-button flex flex-col items-center gap-1 rounded-xl px-3 py-2 text-xs font-medium text-slate-600 transition hover:bg-slate-100">
              <span>🏠</span>
              <span>Übersicht</span>
            </button>
            <button data-nav="search" class="nav-button flex flex-col items-center gap-1 rounded-xl px-3 py-2 text-xs font-medium text-slate-600 transition hover:bg-slate-100">
              <span>🔎</span>
              <span>Suchen</span>
            </button>
            <button data-nav="form" class="nav-button flex flex-col items-center gap-1 rounded-xl px-3 py-2 text-xs font-medium text-slate-600 transition hover:bg-slate-100">
              <span>➕</span>
              <span>Hinzufügen</span>
            </button>
          </div>
        </nav>
      </div>
    </div>

    <div id="toastContainer" class="pointer-events-none fixed inset-x-0 top-5 z-50 mx-auto flex max-w-sm flex-col items-center gap-2 px-4"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
